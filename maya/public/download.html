<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Download Maya</title>
  </head>
  <body
    style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111;color:#eee;font-family:sans-serif"

    <main style="width:min(28rem,90vw);text-align:center">
      <p style="opacity:0.7;margin:0 0 0.5rem">Maya</p>
      <h1 style="margin:0 0 1.25rem;font-size:1.6rem">Download the project</h1>
      <p style="line-height:1.5;opacity:0.85;margin:0 0 1.5rem">
        Click download. Unzip. You get a folder named <b>maya</b>. Drag that
        whole folder onto GitHub → flute-master/maya → Add file → Upload files.
      </p>
      <p>
        <a
          href="/maya.zip"
          download="maya.zip"
          style="display:inline-block;background:#e8e4d9;color:#111;text-decoration:none;padding:0.85rem 1.4rem;border-radius:999px;font-weight:600"
          >Download the Maya folder</a
        >
      </p>
      <p style="margin:1.25rem 0 0">
        <a href="/clips/sage.mp3" download="maya-sage.mp3" style="color:#9cf"
          >Download voice clip (mp3)</a
        >
      </p>
      <p style="margin:1.5rem 0 0">
        <a href="/hear.html" style="color:#9cf">Play clips</a>
        ·
        <a href="/" style="color:#9cf">Open Maya</a>
      </p>
    </main>
